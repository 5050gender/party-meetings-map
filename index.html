const PARTY_COLORS = {};
const PALETTE = ["#1a73e8", "#0f9e8e", "#1ae87a", "#e8c11a", "#a01ae8", "#e81a9d"];
function colorFor(party) {
  if (!(party in PARTY_COLORS)) {
    PARTY_COLORS[party] = PALETTE[Object.keys(PARTY_COLORS).length % PALETTE.length];
  }
  return PARTY_COLORS[party];
}

const map = L.map('map').setView([31.5, 34.9], 8); // centered on Israel
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

const clusterGroup = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 20 });

let plotted = 0;
MEETINGS.forEach(m => {
  if (m.lat == null || m.lon == null) return;
  plotted++;

  const color = colorFor(m.party);
  const icon = L.divIcon({
    className: 'meeting-pin',
    html: `<span style="display:block;width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,0.5);box-sizing:border-box;"></span>`,
    iconSize: [16, 16],
  });

  const marker = L.marker([m.lat, m.lon], { icon });

  const dateLine = m.date + (m.time ? ` · ${m.time}` : '');
  const placeLine = [m.address, m.city].filter(Boolean).join(', ');

  const popupHtml = `
    <div class="popup-title">${m.meeting_name}</div>
    <div class="popup-party">${m.party}</div>
    <div class="popup-line">📅 ${dateLine}</div>
    <div class="popup-line">📍 ${placeLine || m.city || ''}</div>
    <a class="popup-register" href="${m.registration_link}" target="_blank" rel="noopener noreferrer">להרשמה</a>
  `;
  marker.bindPopup(popupHtml);
  clusterGroup.addLayer(marker);
});

map.addLayer(clusterGroup);

document.getElementById('count').textContent = `${plotted} / ${MEETINGS.length} אירועים על המפה`;

const legend = document.getElementById('legend');
Object.entries(PARTY_COLORS).forEach(([party, color]) => {
  const row = document.createElement('div');
  row.innerHTML = `<span class="dot" style="background:${color}"></span>${party}`;
  legend.appendChild(row);
});
</script>
