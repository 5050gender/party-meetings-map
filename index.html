// Fixed colors per party so they never shift when the party list changes
// (e.g. a party temporarily having zero meetings, or a new party appearing).
// Add new parties here as they come up; do not reassign existing ones.
const KNOWN_PARTY_COLORS = {
  "ישר! עם איזנקוט": "#1a73e8",   // blue
  "ביחד – נפתלי בנט": "#0f9e8e",  // teal
  "הדמוקרטים": "#1ae87a",         // green
  "הציונות הדתית": "#e8c11a",     // yellow
  "יש עתיד": "#a01ae8",           // purple
  "ישראל ביתנו": "#1ac8e8",       // cyan
  "הבית הציוני – המילואימניקים": "#7a4b1a", // brown
  "חד\"ש": "#e81a1a",             // red
  "פאנל של כמה מפלגות": "#e8741a", // orange
  "עוצמה יהודית": "#8e1a5c",      // magenta
};
const FALLBACK_PALETTE = ["#607d8b", "#8e44ad"];
function hashColor(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return FALLBACK_PALETTE[hash % FALLBACK_PALETTE.length];
}
const PARTY_COLORS = {};
function colorFor(party) {
  if (!(party in PARTY_COLORS)) {
    PARTY_COLORS[party] = KNOWN_PARTY_COLORS[party] || hashColor(party);
  }
  return PARTY_COLORS[party];
}

const map = L.map('map').setView([31.5, 34.9], 8); // centered on Israel
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

const clusterGroup = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 20 });
map.addLayer(clusterGroup);

function buildMarker(m) {
  const color = colorFor(m.party);
  const isLeader = !!m.leader_appearance;
  const size = isLeader ? 22 : 16;
  const html = isLeader
    ? `<span style="display:flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid gold;box-shadow:0 0 4px rgba(0,0,0,0.6);color:gold;font-size:13px;line-height:1;box-sizing:border-box;">★</span>`
    : `<span style="display:block;width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,0.5);box-sizing:border-box;"></span>`;

  const icon = L.divIcon({ className: 'meeting-pin', html, iconSize: [size, size] });
  const marker = L.marker([m.lat, m.lon], { icon, zIndexOffset: isLeader ? 1000 : 0 });

  const dateLine = m.date + (m.time ? ` · ${m.time}` : '');
  const placeLine = [m.address, m.city].filter(Boolean).join(', ');
  const leaderLine = isLeader ? `<div class="popup-line popup-leader">⭐ ראש/ת המפלגה בפגישה זו</div>` : '';
  const registerButton = m.registration_link
    ? `<a class="popup-register" href="${m.registration_link}" target="_blank" rel="noopener noreferrer">להרשמה</a>`
    : '';

  const popupHtml = `
    <div class="popup-title">${m.meeting_name}</div>
    <div class="popup-party">${m.party}</div>
    ${leaderLine}
    <div class="popup-line">📅 ${dateLine}</div>
    <div class="popup-line">📍 ${placeLine || m.city || ''}</div>
    ${registerButton}
  `;
  marker.bindPopup(popupHtml);
  return marker;
}

function sevenDaysFromNowStr() {
  const d = new Date();
  d.setDate(d.getDate() + 7);
  return d.toISOString().slice(0, 10);
}

function renderMeetings() {
  const priorityOnly = document.getElementById('priority-toggle')?.checked;
  const weekOnly = document.getElementById('week-toggle')?.checked;

  clusterGroup.clearLayers();
  let source = MEETINGS;
  if (priorityOnly) source = source.filter(m => m.leader_appearance);
  if (weekOnly) source = source.filter(m => m.date <= sevenDaysFromNowStr());

  let plotted = 0;
  source.forEach(m => {
    if (m.lat == null || m.lon == null) return;
    plotted++;
    clusterGroup.addLayer(buildMarker(m));
  });

  const labels = [];
  if (priorityOnly) labels.push('בכירים בלבד');
  if (weekOnly) labels.push('השבוע הקרוב בלבד');
  const suffix = labels.length ? ` (${labels.join(', ')})` : '';
  document.getElementById('count').textContent = `${plotted} / ${source.length} אירועים על המפה${suffix}`;
}

renderMeetings();

const hasLeaderMeetings = MEETINGS.some(m => m.leader_appearance);
let controlsHtml = '';
if (hasLeaderMeetings) {
  controlsHtml += `
    <label>
      <input type="checkbox" id="priority-toggle" />
      <span>הצג רק פגישות עם ראש/ת המפלגה</span>
    </label>
  `;
}
controlsHtml += `
  <label>
    <input type="checkbox" id="week-toggle" />
    <span>פגישות בשבוע הקרוב בלבד</span>
  </label>
`;

document.body.classList.add('has-toggle');
const controlsBar = document.getElementById('controls-bar');
controlsBar.innerHTML = controlsHtml;

function layoutControlsBar() {
  const barHeight = controlsBar.offsetHeight;
  document.getElementById('map').style.height = `calc(100% - ${barHeight}px)`;
  document.getElementById('legend').style.bottom = `${barHeight + 20}px`;
  map.invalidateSize();
}
layoutControlsBar();

document.getElementById('week-toggle').addEventListener('change', renderMeetings);
const priorityToggleEl = document.getElementById('priority-toggle');
if (priorityToggleEl) priorityToggleEl.addEventListener('change', renderMeetings);

const legend = document.getElementById('legend');
Object.entries(PARTY_COLORS).forEach(([party, color]) => {
  const row = document.createElement('div');
  row.innerHTML = `<span class="dot" style="background:${color}"></span>${party}`;
  legend.appendChild(row);
});
if (MEETINGS.some(m => m.leader_appearance)) {
  const starRow = document.createElement('div');
  starRow.innerHTML = `<span style="color:gold;font-size:14px;">★</span> ראש/ת המפלגה בפגישה זו`;
  legend.appendChild(starRow);
}
</script>
